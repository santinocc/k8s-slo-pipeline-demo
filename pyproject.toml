# Tool configuration only; the API is not packaged as a distribution.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "pipeline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN"]
ignore = ["B008"]  # FastAPI uses function calls (Depends, Query) as parameter defaults.

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "pipeline/tests"]
pythonpath = ["app", "pipeline"]
markers = ["integration: needs a PostgreSQL database (TEST_POSTGRES_DSN)"]

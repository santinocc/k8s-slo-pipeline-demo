# Local single-node cluster for the k8s-slo-pipeline-demo learning project.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: slo-demo
nodes:
  - role: control-plane
    # Node image pinned by tag and digest (default image for kind v0.33.0).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # NodePort Services mapped to localhost: API :8080, Prometheus :9090, Grafana :3000.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP

# Example only, with placeholder values. Do not put real credentials here.
# `make secret` creates the real Secret from your git-ignored .env file:
#   kubectl -n slo-demo create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: slo-demo
type: Opaque
stringData:
  POSTGRES_USER: slo_demo
  POSTGRES_PASSWORD: change-me

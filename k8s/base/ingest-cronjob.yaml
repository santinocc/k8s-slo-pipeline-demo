# Data pipeline: loads synthetic sensor readings into Postgres every 5 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  # Never run two ingestions at once; skip a run if the previous one is still going.
  concurrencyPolicy: Forbid
  # If a run cannot start within 2 minutes of its slot (e.g. controller down), skip it.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3  # Keep failed Jobs around so they can be inspected.
  jobTemplate:
    spec:
      # Retry a failing run up to 3 times (4 pods in total), with exponential
      # backoff (10s, 20s, 40s) between attempts. Then the Job is marked Failed.
      backoffLimit: 3
      # Give up before the next scheduled slot.
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest
        spec:
          # Never: each retry is a new pod, so every failed attempt stays visible.
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              # Built locally and loaded with `kind load`, never pulled from a registry.
              image: slo-demo-pipeline:dev
              imagePullPolicy: Never
              envFrom:
                - configMapRef:
                    name: api-config
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
                - name: INGEST_ITEM_COUNT
                  value: "50"
                - name: INGEST_WINDOW_MINUTES
                  value: "5"
                # Same schema file Postgres runs on first init; CREATE TABLE IF NOT EXISTS.
                - name: SCHEMA_FILE
                  value: /schema/schema.sql
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: schema
                  mountPath: /schema
                  readOnly: true
          volumes:
            - name: schema
              configMap:
                name: postgres-init

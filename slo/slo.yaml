# Availability SLO for the API (learning project; values chosen for a demo).
# monitoring/slo-rules.yaml implements this definition as Prometheus recording
# and alerting rules; monitoring/tests/test_slo_rules.py checks the two agree.
name: api-availability
service: slo-demo-api
description: >
  99% of API requests return a non-5xx response, measured over a rolling
  28-day window. Probe and scrape endpoints (/health, /ready, /metrics) are
  excluded so that Kubernetes and Prometheus traffic does not dilute the SLI.
# The same SLO in everyday words, using the lemonade-stand picture from the README.
plain_language: |
  The promise: out of every 100 people who ask for lemonade, at least 99 get it.
  We keep score over the last 4 weeks, so one bad minute does not ruin the month.
  A failure is when someone asks and gets nothing because the robot broke (a 5xx
  error). The robots' own check-ups (/health, /ready) and the scoreboard keeper
  (/metrics) are not real customers, so they are not counted.
  That leaves an oops allowance (the error budget) of 1 in 100: a jar of oops
  tokens for the month, and every failed cup uses one.
  Loud alarm (fast burn, page): more than about 14 in 100 keep failing. At that
  speed the jar is empty in about 2 days, so someone must come right now.
  Quiet note (slow burn, ticket): more than 6 in 100 keep failing for hours. The
  jar would be empty in under 5 days, so we fix it soon.
  Each alarm checks twice: has it been bad for a while (long window), and is it
  still bad right now (short window)? It rings only if both are true, so one
  spilled cup does not set it off, and it stops soon after things get better.

objective: 0.99          # 99% of requests are good
window: 28d              # rolling compliance window
# error budget = 1 - objective = 1% of requests in the window

sli:
  type: request-based availability
  # "{{window}}" is replaced with each rate window (5m, 30m, 1h, 6h, 28d).
  error_query: >-
    sum(rate(http_requests_total{job="api", namespace="slo-demo", route!~"/health|/ready|/metrics", status=~"5.."}[{{window}}]))
  total_query: >-
    sum(rate(http_requests_total{job="api", namespace="slo-demo", route!~"/health|/ready|/metrics"}[{{window}}]))
  # error ratio = error_query / total_query; good events = total - errors

# Multi-window, multi-burn-rate alerts (Google SRE Workbook, chapter 5).
# Burn rate 1 = spending the budget exactly over the 28d window.
# An alert fires only when BOTH windows exceed the threshold: the long window
# shows the burn is significant, the short window shows it is still happening,
# so the alert clears soon after recovery.
alerting:
  - alert: SLOErrorBudgetBurnFast
    burn_rate: 14.4      # error ratio > 14.4%: ~2% of the 28d budget per hour
    long_window: 1h
    short_window: 5m
    for: 2m
    severity: page
  - alert: SLOErrorBudgetBurnSlow
    burn_rate: 6         # error ratio > 6%: ~5% of the 28d budget per 6 hours
    long_window: 6h
    short_window: 30m
    for: 15m
    severity: ticket

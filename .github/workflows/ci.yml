# CI for the k8s-slo-pipeline-demo learning project.
# Runs the same Makefile targets as a local checkout: lint and tests, the
# Postgres integration tests, the promtool rule tests, the image build and size
# check, and manifest validation against a throwaway kind cluster.
# Actions are pinned to full commit SHAs; the tag is in the comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Lint and unit tests
        run: make test PYTHON=python
      - name: Integration tests (throwaway PostgreSQL container)
        run: make test-integration PYTHON=python
      - name: Prometheus rule tests (promtool)
        run: make test-rules PYTHON=python

  build:
    name: Build images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API and pipeline images
        run: make build
      - name: Check size and non-root user
        run: make image-size

  validate:
    name: Validate manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      # The dry run needs a reachable API server; kind gives a disposable one
      # built from the same pinned config as the local cluster.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          config: kind/kind-config.yaml
          cluster_name: slo-demo
      - name: kubeconform and kubectl dry run
        run: make validate
